<!doctype html><html><head><meta charset="utf-8"><title>Create Brute</title><script src="https://unpkg.com/@ruffle-rs/ruffle"></script><script src="glad.js"></script><script src="brute-app.js"></script><style>body{font:15px system-ui;background:#171717;color:#ddd;max-width:900px;margin:auto;padding:24px}.box{background:#252525;border:1px solid #444;padding:16px;margin:12px 0}input,button{background:#111;color:#eee;border:1px solid #666;padding:8px;border-radius:4px}input{width:100%}.fields{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.preview{height:260px;background:#000;margin:12px 0}.row{display:flex;gap:10px}.row>*{flex:1}a{color:#8bd}</style></head><body><p><a href="brute-party.html">Party</a></p><h1>Create a brute</h1><div class="box"><label>Name<input id="name" value="Newbie"></label><label>Custom ID<input id="id" type="number"></label><label>Level<input id="level" type="number" min="1" max="500" value="1"></label><p>GFX fields</p><div id="fields" class="fields"></div><p><button id="random">Random GFX</button> <button id="create">Create brute</button></p><div id="preview" class="preview"></div><div id="stats"></div><p id="msg"></p></div><script>
const $=x=>document.getElementById(x),A=BruteApp,S=A.reset(A.load());function refresh(){const p=A.parts([...$('fields').children].map(x=>x.value).join(';'));$('preview').replaceChildren();A.preview($('preview'),p.join(';'));const l=+$('level').value||1,d=GladAPI.describe(+$('id').value||1,l-1,Array(l-1).fill(0)).fin;$('stats').textContent='Force '+d.force+' · Agility '+d.agility+' · Speed '+d.speed+' · Life '+d.life+' · '+A.need(l)+' XP to next level'}function setFields(g){$('fields').replaceChildren(...A.parts(g).map((v,i)=>{const x=document.createElement('input');x.value=v;x.title='GFX '+i;x.oninput=refresh;return x}));refresh()}$('random').onclick=()=>setFields(A.gfx());$('level').oninput=refresh;$('id').oninput=refresh;$('create').onclick=()=>{const name=$('name').value.trim(),id=+$('id').value;if(!name||!Number.isInteger(id)||id<1||S.brutes.some(b=>b.id===id))return $('msg').textContent='Enter a unique positive ID and name.';S.brutes.push({name,id,level:+$('level').value||1,xp:0,gfx:[...$('fields').children].map(x=>x.value).join(';'),choices:Array(Math.max(0,(+$('level').value||1)-1)).fill(0).map(()=>Math.floor(Math.random()*2))});A.save(S);location.href='brute-party.html'};setFields(A.gfx());
</script></body></html>
