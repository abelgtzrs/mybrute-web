<!doctype html><html><head><meta charset="utf-8"><title>Select opponent</title><script src="glad.js"></script><script src="brute-app.js"></script><style>body{font:15px system-ui;background:#171717;color:#ddd;max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:#252525;border:1px solid #444;padding:12px}.preview{height:180px;background:#000}a{color:#8bd}</style></head><body><p><a href="brute-party.html">Party</a></p><h1>Select an opponent</h1><div id="list" class="grid"></div><script>const A=BruteApp,S=A.load(),id=+new URLSearchParams(location.search).get('id'),b=S.brutes.find(x=>x.id===id),L=document.getElementById('list');if(!b)L.textContent='Brute not found.';else Array.from({length:8},(_,i)=>{const o={id:10000000+Math.floor(Math.random()*89999999),name:'Wild brute '+(i+1),level:b.level,xp:0,gfx:A.gfx(),choices:Array.from({length:b.level-1},()=>Math.floor(Math.random()*2))};const c=document.createElement('article');c.className='card';c.innerHTML='<div class="preview"></div><h3></h3><p>Level '+o.level+' · ID '+o.id+'</p><a>Fight</a>';c.querySelector('h3').textContent=o.name;c.querySelector('a').href='brute-fight.html?player='+b.id+'&opponent='+encodeURIComponent(JSON.stringify(o));L.appendChild(c);A.preview(c.querySelector('.preview'),o.gfx)});</script></body></html>
