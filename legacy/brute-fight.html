<!doctype html><html><head><meta charset="utf-8"><title>Fight</title><script src="https://unpkg.com/@ruffle-rs/ruffle"></script><script src="glad.js"></script><script src="labrute.js"></script><script src="fight.js"></script><script src="brute-app.js"></script><style>body{font:15px system-ui;background:#171717;color:#ddd;max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.box{background:#252525;border:1px solid #444;padding:12px}.client{height:560px;background:#000}.history{border-top:1px solid #555;padding:8px 0}a{color:#8bd}</style></head><body><p><a href="brute-party.html">Party</a></p><div class="grid"><main><h1>Fight</h1><div id="client" class="client"></div><div id="out"></div></main><aside class="box"><h2>Lifetime statistics</h2><div id="stats"></div><h2>Fight history</h2><div id="history"></div></aside></div><script>const A=BruteApp,S=A.load(),q=new URLSearchParams(location.search),b=S.brutes.find(x=>x.id==q.get('player')),o=JSON.parse(q.get('opponent')||'null');function stats(){const x=b&&b.stats||{wins:0,losses:0,damage:0,weaponsKnocked:0,weaponsDrawn:0};document.getElementById('stats').innerHTML='Wins: '+x.wins+'<br>Losses: '+x.losses+'<br>Damage dealt: '+x.damage+'<br>Weapons knocked: '+x.weaponsKnocked+'<br>Weapons drawn: '+x.weaponsDrawn}function history(){document.getElementById('history').innerHTML=(b&&b.history||[]).slice().reverse().map((h,i)=>'<div class="history"><a href="brute-fight.html?replay='+encodeURIComponent(h.payload)+'">Fight '+(b.history.length-i)+'</a> · '+(h.win?'Win':'Loss')+' · '+h.xp+' XP</div>').join('')||'No fights yet.'}stats();history();if(b&&o){fetch('fights.json').then(r=>r.json()).then(fs=>{const s=LaBrute.open(fs[0].params);s.glads[0]={...s.glads[0],name:b.name,id:b.id,lvl:b.level-1,gfx:b.gfx,choices:b.choices||[],team:0};s.glads[1]={...s.glads[1],name:o.name,id:o.id,lvl:o.level-1,gfx:o.gfx,choices:o.choices||[],team:1};const payload=s.params(),p=RufflePlayer.newest().createPlayer();p.style.width='100%';p.style.height='100%';document.getElementById('client').replaceChildren(p);p.load({url:'client.swf',parameters:payload,base:'.',allowScriptAccess:false,letterbox:'on',logLevel:'warn'});const result=FightAPI.run(s.fightInput()),win=result.win===0,xp=win?2:1;b.stats=b.stats||{wins:0,losses:0,damage:0,weaponsKnocked:0,weaponsDrawn:0};b.stats[win?'wins':'losses']++;b.history=b.history||[];b.history.push({payload,xp,win});b.xp+=xp;A.save(S);document.getElementById('out').textContent=(win?'Win: +2 XP':'Loss: +1 XP')+(b.xp>=A.need(b.level)?' · Level-up choice available':'');stats();history()})}</script></body></html>
